<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Privacy Guard · Live Intercept</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #1a1d23;
      --panel-2: #232730;
      --text: #e6e7eb;
      --text-dim: #8b95a7;
      --accent: #f7931a;
      --critical: #f7931a;
      --high: #facc15;
      --medium: #22d3ee;
      --low: #60a5fa;
      --regex: #f7931a;
      --llm: #60a5fa;
      --safe: #34d399;
      --danger: #fb923c;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.3px;
    }
    header h1 .accent { color: var(--accent); }
    #status {
      font-size: 12px; color: var(--text-dim);
      display: flex; align-items: center; gap: 6px;
    }
    #status::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-dim); transition: background 0.2s;
    }
    #status[data-state="connected"]::before { background: var(--safe); }
    #status[data-state="reconnecting"]::before { background: var(--danger); }
    main { padding: 16px 24px 32px; display: flex; flex-direction: column; gap: 16px; }

    .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .kpi {
      background: var(--panel); border-left: 3px solid var(--accent);
      padding: 14px 16px; border-radius: 6px;
    }
    .kpi .num {
      font-size: 28px; font-weight: 700; line-height: 1; color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .kpi .lbl {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-dim); margin-top: 6px;
    }

    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .panel {
      background: var(--panel); padding: 14px 16px; border-radius: 6px;
    }
    .panel h2 {
      margin: 0 0 10px; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-dim); font-weight: 600;
    }
    .bar-row {
      display: grid; grid-template-columns: 110px 1fr 40px;
      gap: 10px; align-items: center; margin-bottom: 6px;
      font-size: 12px;
    }
    .bar-row .lbl { color: var(--text-dim); text-transform: capitalize; }
    .bar-row .val {
      text-align: right; color: var(--text); font-variant-numeric: tabular-nums;
    }
    .bar {
      height: 10px; border-radius: 3px; background: var(--panel-2); overflow: hidden;
    }
    .bar::after {
      content: ""; display: block; height: 100%;
      background: var(--bar-color, var(--accent));
      width: var(--bar-width, 0%);
      transition: width 0.3s ease;
    }
    .bar-critical { --bar-color: var(--critical); }
    .bar-high     { --bar-color: var(--high); }
    .bar-medium   { --bar-color: var(--medium); }
    .bar-low      { --bar-color: var(--low); }
    .bar-cat      { --bar-color: linear-gradient(90deg, var(--accent), #ec4899); }

    #feed-panel { padding: 0; overflow: hidden; }
    #feed-panel h2 { padding: 14px 16px 8px; margin: 0; }
    #feed {
      max-height: 60vh; overflow-y: auto;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .row {
      display: grid;
      grid-template-columns: 130px 1fr 1fr;
      gap: 12px;
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      align-items: start;
    }
    .row:first-child { border-top: none; }
    .meta { color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .ts { font-variant-numeric: tabular-nums; }
    .sev {
      font-size: 10px; padding: 2px 6px; border-radius: 3px;
      text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
      background: var(--panel-2); color: var(--text-dim);
    }
    .sev-critical { background: rgba(247,147,26,0.18); color: var(--critical); }
    .sev-high     { background: rgba(250,204,21,0.18); color: var(--high); }
    .sev-medium   { background: rgba(34,211,238,0.18); color: var(--medium); }
    .sev-low      { background: rgba(96,165,250,0.18); color: var(--low); }
    .pill {
      font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 700;
    }
    .pill-regex { background: rgba(247,147,26,0.2); color: var(--regex); }
    .pill-llm   { background: rgba(96,165,250,0.2); color: var(--llm); }
    .pill-ai-down {
      background: rgba(139,149,167,0.2); color: var(--text-dim);
      border: 1px solid rgba(251,146,60,0.4); cursor: help;
    }
    .raw, .red { padding: 6px 8px; border-radius: 3px; word-break: break-all; cursor: default; }
    .raw {
      background: rgba(251,146,60,0.08); color: var(--danger);
      filter: blur(4px); transition: filter 0.2s; cursor: pointer;
    }
    .raw.revealed { filter: none; }
    .red { background: rgba(52,211,153,0.08); color: var(--safe); }

    .empty {
      padding: 32px 16px; text-align: center; color: var(--text-dim);
      font-style: italic;
    }
  </style>
</head>
<body>
  <header>
    <h1>Privacy Guard <span class="accent">·</span> Live Intercept</h1>
    <div id="status" data-state="connecting">connecting</div>
  </header>
  <main>
    <section class="kpi-row" id="kpis">
      <div class="kpi"><div class="num" id="kpi-processed">0</div><div class="lbl">Processed</div></div>
      <div class="kpi"><div class="num" id="kpi-redacted">0</div><div class="lbl">Redacted</div></div>
      <div class="kpi"><div class="num" id="kpi-rate">—</div><div class="lbl">Rate</div></div>
      <div class="kpi"><div class="num" id="kpi-llm-only">0</div><div class="lbl">LLM-only catches</div></div>
    </section>
    <section class="charts-row">
      <div class="panel">
        <h2>Severity (last 200)</h2>
        <div id="severity-bars"></div>
      </div>
      <div class="panel">
        <h2>Top Categories (last 200)</h2>
        <div id="category-bars"></div>
      </div>
    </section>
    <section class="panel" id="feed-panel">
      <h2>Live Intercept Feed (click raw to reveal)</h2>
      <div id="feed"><div class="empty">Waiting for events…</div></div>
    </section>
  </main>

  <script>
    const MAX_FEED_ROWS = 100;
    const state = {
      counters: { totalProcessed: 0, totalRedacted: 0, llmOnlyCatches: 0 },
      severityCounts: { low: 0, medium: 0, high: 0, critical: 0 },
      categoryCounts: {},
    };
    const feedRoot = document.getElementById("feed");
    const statusEl = document.getElementById("status");

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    function setStatus(s) {
      statusEl.dataset.state = s;
      statusEl.textContent = s;
    }

    function renderKpis() {
      document.getElementById("kpi-processed").textContent = state.counters.totalProcessed;
      document.getElementById("kpi-redacted").textContent = state.counters.totalRedacted;
      const rate = state.counters.totalProcessed === 0
        ? "—"
        : Math.round((state.counters.totalRedacted / state.counters.totalProcessed) * 100) + "%";
      document.getElementById("kpi-rate").textContent = rate;
      document.getElementById("kpi-llm-only").textContent = state.counters.llmOnlyCatches;
    }

    function renderSeverity() {
      const order = ["critical", "high", "medium", "low"];
      const max = Math.max(1, ...order.map((s) => state.severityCounts[s] || 0));
      document.getElementById("severity-bars").innerHTML = order.map((s) => {
        const v = state.severityCounts[s] || 0;
        const pct = (v / max) * 100;
        return `<div class="bar-row">
          <span class="lbl">${s}</span>
          <div class="bar bar-${s}" style="--bar-width:${pct}%"></div>
          <span class="val">${v}</span>
        </div>`;
      }).join("");
    }

    function renderCategories() {
      const entries = Object.entries(state.categoryCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);
      if (entries.length === 0) {
        document.getElementById("category-bars").innerHTML =
          '<div style="color:var(--text-dim); font-size:12px;">No categories yet.</div>';
        return;
      }
      const max = Math.max(1, ...entries.map(([, v]) => v));
      document.getElementById("category-bars").innerHTML = entries.map(([k, v]) => {
        const pct = (v / max) * 100;
        return `<div class="bar-row">
          <span class="lbl">${escapeHtml(k)}</span>
          <div class="bar bar-cat" style="--bar-width:${pct}%"></div>
          <span class="val">${v}</span>
        </div>`;
      }).join("");
    }

    function renderRowHtml(entry) {
      const ts = new Date(entry.ts).toLocaleTimeString();
      const sevHtml = entry.severity === "none"
        ? '<span class="sev">none</span>'
        : `<span class="sev sev-${entry.severity}">${entry.severity}</span>`;
      const seen = new Set();
      const sourcePills = entry.sources.filter((s) => {
        if (seen.has(s)) return false;
        seen.add(s); return true;
      }).map((s) => `<span class="pill pill-${s}">${s[0].toUpperCase()}</span>`).join(" ");
      const aiDownHtml = entry.aiAudited === false
        ? `<span class="pill pill-ai-down" title="LLM unavailable (${escapeHtml(entry.aiError || "unknown")}) — regex-only result">AI ↯</span>`
        : "";
      return `<div class="row" data-id="${entry.id}">
        <div class="meta">
          <span class="ts">${ts}</span>
          ${sevHtml}
          ${sourcePills}
          ${aiDownHtml}
        </div>
        <div class="raw" onclick="this.classList.toggle('revealed')">${escapeHtml(entry.originalMessage)}</div>
        <div class="red">${escapeHtml(entry.redactedMessage)}</div>
      </div>`;
    }

    function clearEmptyState() {
      const empty = feedRoot.querySelector(".empty");
      if (empty) empty.remove();
    }

    function appendRow(entry) {
      clearEmptyState();
      feedRoot.insertAdjacentHTML("beforeend", renderRowHtml(entry));
      trimFeed();
    }

    function prependRow(entry) {
      clearEmptyState();
      feedRoot.insertAdjacentHTML("afterbegin", renderRowHtml(entry));
      trimFeed();
    }

    function trimFeed() {
      while (feedRoot.children.length > MAX_FEED_ROWS) {
        feedRoot.lastElementChild.remove();
      }
    }

    function onEvent(entry) {
      state.counters.totalProcessed++;
      if (entry.severity !== "none") {
        state.counters.totalRedacted++;
        if (state.severityCounts[entry.severity] !== undefined) {
          state.severityCounts[entry.severity]++;
        }
      }
      const hasLlm = entry.sources.includes("llm");
      const hasRegex = entry.sources.includes("regex");
      if (hasLlm && !hasRegex) state.counters.llmOnlyCatches++;
      for (const cat of entry.categories) {
        state.categoryCounts[cat] = (state.categoryCounts[cat] || 0) + 1;
      }
      renderKpis();
      renderSeverity();
      renderCategories();
      prependRow(entry);
    }

    async function init() {
      try {
        const snap = await fetch("/api/dashboard/snapshot").then((r) => r.json());
        state.counters = snap.counters;
        state.severityCounts = snap.severityCounts;
        state.categoryCounts = snap.categoryCounts;
        renderKpis();
        renderSeverity();
        renderCategories();
        // snap.recent is newest-first. Appending in that order puts the
        // newest event at the top of the feed (first appended = top child).
        for (const entry of snap.recent) {
          appendRow(entry);
        }
      } catch (err) {
        setStatus("snapshot-failed");
        console.error("snapshot failed", err);
      }

      const sse = new EventSource("/api/dashboard/stream");
      sse.onopen = () => setStatus("connected");
      sse.onerror = () => setStatus("reconnecting");
      sse.onmessage = (e) => {
        try { onEvent(JSON.parse(e.data)); }
        catch (err) { console.error("bad SSE payload", err); }
      };
    }

    init();
  </script>
</body>
</html>
